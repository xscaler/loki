# xScaler fork: weekly scan of the newest released loki image. When it carries
# fixable HIGH or CRITICAL findings, build a candidate from the same commit (no
# push) and scan it. Only when the rebuild resolves at least one of those
# findings (compared by vulnerability ID and package) cut the next -xs.<n> tag
# and dispatch xs-release. Findings the rebuild cannot fix (Go stdlib, modules)
# need an upstream bump and are listed in the job summary.
name: xs-weekly

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: xs-weekly
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/xscaler/loki

jobs:
  rescan:
    name: scan latest release and rebuild if needed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the next release tag
      actions: write # dispatch xs-release
      packages: read # pull the released image for scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the highest release tag
        id: latest
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*-xs.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?-xs\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -z "${tag}" ]; then
            echo "::notice::no v*-xs.* tag exists yet, nothing to scan"
            echo "tag=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-list -n1 "${tag}")" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: steps.latest.outputs.tag != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Trivy
        if: steps.latest.outputs.tag != ''
        uses: ./.github/actions/xs-setup-trivy

      - name: Scan the released image
        id: scan
        if: steps.latest.outputs.tag != ''
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          REPORT: ${{ runner.temp }}/published.json
        run: |
          set -euo pipefail
          trivy image "${GHCR_IMAGE}:${VERSION}" --ignore-unfixed \
            --severity HIGH,CRITICAL --format json --output "${REPORT}" \
            --exit-code 0 --no-progress
          trivy image "${GHCR_IMAGE}:${VERSION}" --ignore-unfixed \
            --severity HIGH,CRITICAL --format table --exit-code 0 --no-progress
          count="$(jq '[.Results[]?.Vulnerabilities[]?] | length' "${REPORT}")"
          echo "fixable HIGH/CRITICAL findings in ${VERSION}: ${count}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          if [ "${count}" = "0" ]; then
            echo "### Weekly scan: ${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
            echo "No fixable HIGH or CRITICAL findings. Nothing to do." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Set up Docker Buildx
        if: steps.scan.outputs.count != '' && steps.scan.outputs.count != '0'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check out the released commit
        if: steps.scan.outputs.count != '' && steps.scan.outputs.count != '0'
        env:
          COMMIT: ${{ steps.latest.outputs.commit }}
        run: git checkout --detach "${COMMIT}"

      - name: Read build parameters
        id: params
        if: steps.scan.outputs.count != '' && steps.scan.outputs.count != '0'
        run: |
          set -euo pipefail
          go_version="$(sed -n 's/^GO_VERSION *:= *//p' Makefile)"
          if [ -z "${go_version}" ]; then
            echo "::error::GO_VERSION not found in Makefile"
            exit 1
          fi
          echo "go_version=${go_version}" >> "${GITHUB_OUTPUT}"

      - name: Build candidate image (not pushed)
        if: steps.scan.outputs.count != '' && steps.scan.outputs.count != '0'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmd/loki/Dockerfile
          platforms: linux/amd64
          build-args: |
            IMAGE_TAG=${{ steps.latest.outputs.version }}
            GO_VERSION=${{ steps.params.outputs.go_version }}
          provenance: false
          sbom: false
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/candidate.tar

      - name: Compare candidate with the published image
        id: compare
        if: steps.scan.outputs.count != '' && steps.scan.outputs.count != '0'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          PUBLISHED: ${{ runner.temp }}/published.json
          CANDIDATE_TAR: ${{ runner.temp }}/candidate.tar
          CANDIDATE: ${{ runner.temp }}/candidate.json
        run: |
          set -euo pipefail
          trivy image --input "${CANDIDATE_TAR}" --ignore-unfixed \
            --severity HIGH,CRITICAL --format json --output "${CANDIDATE}" \
            --exit-code 0 --no-progress
          # One "<id> <package>" line per fixable finding.
          keys='[.Results[]?.Vulnerabilities[]? | "\(.VulnerabilityID) \(.PkgName)"] | unique | .[]'
          jq -r "${keys}" "${PUBLISHED}" > "${RUNNER_TEMP}/published.keys"
          jq -r "${keys}" "${CANDIDATE}" > "${RUNNER_TEMP}/candidate.keys"
          comm -23 "${RUNNER_TEMP}/published.keys" "${RUNNER_TEMP}/candidate.keys" > "${RUNNER_TEMP}/resolved.keys"
          resolved="$(wc -l < "${RUNNER_TEMP}/resolved.keys")"
          remaining="$(wc -l < "${RUNNER_TEMP}/candidate.keys")"
          {
            echo "### Weekly scan: ${VERSION}"
            echo
            echo "Published image: $(wc -l < "${RUNNER_TEMP}/published.keys") fixable HIGH/CRITICAL findings."
            echo "Candidate rebuild from the same commit: ${remaining} findings, ${resolved} resolved."
            echo
            if [ "${resolved}" -gt 0 ]; then
              echo "The rebuild fixes these, so the next -xs tag will be cut:"
              echo
              sed 's/^/- /' "${RUNNER_TEMP}/resolved.keys"
            else
              echo "The rebuild fixes nothing, so no tag is cut."
            fi
            echo
            if [ "${remaining}" -gt 0 ]; then
              echo "Findings that remain after a rebuild and need an upstream bump (Go toolchain or modules):"
              echo
              sed 's/^/- /' "${RUNNER_TEMP}/candidate.keys"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${resolved}" -gt 0 ]; then
            echo "fixes=true" >> "${GITHUB_OUTPUT}"
          else
            echo "fixes=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::rebuild would not fix any finding; ${remaining} need an upstream bump"
          fi

      - name: Tag and dispatch a rebuild
        if: steps.compare.outputs.fixes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          COMMIT: ${{ steps.latest.outputs.commit }}
        run: |
          set -euo pipefail
          base="${LATEST_TAG%-xs.*}"
          n="${LATEST_TAG##*-xs.}"
          next="${base}-xs.$((n + 1))"
          echo "creating ${next} on ${COMMIT}"
          gh api --method POST "repos/${REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next}" -f "sha=${COMMIT}"
          gh workflow run xs-release.yml --repo "${REPOSITORY}" --ref main -f "tag=${next}"
