# xScaler fork: unit tests and lint, mirroring upstream's reusable
# grafana/loki-release check workflow (pinned below) on GitHub-hosted runners.
#
# Tools installed by upstream's pre-steps come from the pinned loki-release
# install script; the ones we install ourselves are pinned by version and sha256.
#
# Also mirrored: build-loki-binary.yml (cross-build matrix) and lint-jsonnet.yml.
#
# Upstream workflows not reproduced (none runs a unit suite we lack):
#   - logql-correctness.yml, logql-bench.yml: need Grafana's large arm64 runner
#     and a generated benchmark dataset; they are benchmarks, not the unit suite.
#   - helm-ci, helm-diff-ci, helm-release: charts live in xscaler/helm-charts.
#   - nix-ci, operator*: out of scope (nix packaging, operator).
#   - snyk, relyance, secret-scanning, claude*, labeler, conventional-commits,
#     backport, release and *-release-pr, images, querytee-images, logql-analyzer,
#     syft-sbom-ci, deploy-pr-preview: Grafana release, security and docs infra.
#   - govulncheck: upstream has no govulncheck workflow at v3.7.9.
#
# Upstream jobs not reproduced here:
#   - "build docs website": needs the grafana/docs-base image and Grafana
#     docs infra; the fork ships no docs site.
#   - GitHub App token / Grafana self-hosted runner labels (ubuntu-x64): not
#     available; the jobs run on ubuntu-latest in the same golang image.
name: xs-test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 0"

permissions: {}

# A branch with an open pull request triggers both a push and a pull_request
# run; they share one group so only one of them survives.
concurrency:
  group: xs-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # grafana/loki-release commit upstream's check workflow is pinned to.
  RELEASE_LIB_REF: 6cba58c3b7083631092af8e8fbaeb71a647fab93
  BUILD_IN_CONTAINER: "false"

jobs:
  check-files:
    name: check files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build tools
        run: |
          curl -fsSL -o /tmp/install_workflow_dependencies.sh \
            "https://raw.githubusercontent.com/grafana/loki-release/${RELEASE_LIB_REF}/workflows/install_workflow_dependencies.sh"
          # SRC_DIR points nowhere so the script skips the jsonnet bundle update,
          # as it does in upstream's check workflow.
          SRC_DIR=/nonexistent sh /tmp/install_workflow_dependencies.sh loki-release loki-build-tools
      - name: Install shellcheck
        run: |
          apt-get install -qy tar xz-utils
          .github/scripts/xs-install-tool.sh shellcheck
      - name: Check generated files
        run: make check-generated-files
      - name: Check go.mod
        run: make check-mod
      - name: Check docs
        run: make check-doc
      - name: Validate example configs
        run: make validate-example-configs
      - name: Validate dev cluster config
        run: make validate-dev-cluster-config
      - name: Check example config docs
        run: make check-example-config-doc
      - name: Lint scripts
        run: make lint-scripts
      - name: Check format
        env:
          GIT_TARGET_BRANCH: main
        run: |
          git fetch --no-tags origin "main:refs/remotes/origin/${GIT_TARGET_BRANCH}"
          make check-format

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build tools (upstream pre-step)
        run: |
          curl -fsSL -o /tmp/install_workflow_dependencies.sh \
            "https://raw.githubusercontent.com/grafana/loki-release/${RELEASE_LIB_REF}/workflows/install_workflow_dependencies.sh"
          SRC_DIR=/nonexistent sh /tmp/install_workflow_dependencies.sh loki-release loki-build-tools
      - name: Install shellcheck (upstream pre-step)
        run: |
          apt-get install -qy tar xz-utils
          .github/scripts/xs-install-tool.sh shellcheck
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          args: -v --timeout 15m --build-tags linux
          only-new-issues: false

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Integration tests
        run: make test-integration

  collect-packages:
    name: collect test packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.gather.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gather packages
        id: gather
        run: |
          packages="$(find . -path '*_test.go' -printf '%h\n' \
            | grep -e "pkg/push" -e "integration" -e "operator" -e "helm" -v \
            | cut -d / -f 2,3 \
            | uniq \
            | sort \
            | jq --raw-input --slurp --compact-output 'split("\n")[:-1]')"
          echo "packages=${packages}" >> "${GITHUB_OUTPUT}"

  test-packages:
    name: test ${{ matrix.package }}
    needs: collect-packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.collect-packages.outputs.packages) }}
    env:
      MATRIX_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install gotestsum
        run: .github/scripts/xs-install-tool.sh gotestsum
      - name: Test package
        run: gotestsum -- -tags=assert -covermode=atomic -coverprofile=coverage.txt -p=4 "./${MATRIX_PACKAGE}/..."

  faillint:
    name: faillint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install faillint
        run: go install github.com/fatih/faillint@v1.15.0
      - name: faillint
        run: faillint -paths "sync/atomic=go.uber.org/atomic" ./...

  test-push-package:
    name: test pkg/push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install gotestsum
        run: .github/scripts/xs-install-tool.sh gotestsum
      - name: go mod tidy
        working-directory: pkg/push
        run: go mod tidy
      - name: Test pkg/push
        working-directory: pkg/push
        run: gotestsum -- -covermode=atomic -coverprofile=coverage.txt -p=4 ./...

  build-binaries:
    name: build ${{ matrix.binary.name }} (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, arm]
        binary:
          - { name: loki, path: ./cmd/loki }
          - { name: logcli, path: ./cmd/logcli }
          - { name: querytee, path: ./cmd/querytee }
    env:
      GOARCH: ${{ matrix.goarch }}
      BINARY: ${{ matrix.binary.name }}
      BINARY_PATH: ${{ matrix.binary.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: go build -v -o "${BINARY}-linux-${GOARCH}" "${BINARY_PATH}"

  lint-jsonnet:
    name: lint jsonnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up jsonnet tools
        run: |
          go install github.com/google/go-jsonnet/cmd/jsonnet@v0.20.0
          go install github.com/google/go-jsonnet/cmd/jsonnetfmt@v0.20.0
          go install github.com/google/go-jsonnet/cmd/jsonnet-lint@v0.20.0
          go install github.com/monitoring-mixins/mixtool/cmd/mixtool@16dc166166d91e93475b86b9355a4faed2400c18
          go install github.com/jsonnet-bundler/jsonnet-bundler/cmd/jb@v0.5.1
      - name: Lint
        run: make BUILD_IN_CONTAINER=false lint-jsonnet
      - name: Check the compiled mixin is up to date
        run: make BUILD_IN_CONTAINER=false loki-mixin-check

  checks-passed:
    name: checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - check-files
      - faillint
      - golangci-lint
      - build-binaries
      - lint-jsonnet
      - integration
      - test-packages
      - test-push-package
    permissions: {}
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::one or more checks did not succeed: ${RESULTS}"
              exit 1
            fi
          done
          echo "All checks passed"
