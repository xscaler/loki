# xScaler fork: build, scan, publish, sign and verify the loki image.
#
# Modes, chosen in the prepare job:
#   release    push of a v<upstream>-xs.<n> tag, or workflow_dispatch from main.
#              Publishes ghcr.io/xscaler/loki:<upstream>-xs.<n>. The release
#              commit must be reachable from main. A dispatch creates the git
#              tag only after the image is published and verified.
#   rehearsal  push to a ci/** branch. Runs the same publish path against
#              ghcr.io/xscaler/rehearsal/loki:<shortsha>, never the release repo.
#   verify     pull requests and pushes to main. Build and scan only.
name: xs-release

on:
  push:
    branches:
      - main
      - "ci/**"
    tags:
      - "v*-xs.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v3.7.9-xs.0"
        required: true
        type: string
      commit:
        description: "Commit to build (full sha). Empty means the commit of the existing tag."
        required: false
        type: string

permissions: {}

concurrency:
  group: xs-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      image: ${{ steps.meta.outputs.image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      environment: ${{ steps.meta.outputs.environment }}
      cert_identity: ${{ steps.meta.outputs.cert_identity }}
      published: ${{ steps.published.outputs.published }}
      digest: ${{ steps.published.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve mode, version and release commit
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT: ${{ inputs.commit }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=""
          commit="${SHA}"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${REF}" != "refs/heads/main" ]]; then
              echo "::error::releases can only be dispatched from main (ref is ${REF})"
              exit 1
            fi
            tag="${INPUT_TAG}"
            commit=""
          elif [[ "${EVENT_NAME}" == "push" && "${REF_TYPE}" == "tag" ]]; then
            tag="${REF_NAME}"
          fi

          identity="https://github.com/${REPOSITORY}/.github/workflows/xs-release.yml@${REF}"

          if [[ -n "${tag}" ]]; then
            if [[ "${tag}" == *$'\n'* ]] || ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-xs\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::tag does not match v<upstream-version>-xs.<n>"
              exit 1
            fi
            if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
              if [[ -n "${INPUT_COMMIT}" ]]; then
                if [[ "${INPUT_COMMIT}" == *$'\n'* ]] || ! [[ "${INPUT_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::commit must be a full 40 character sha"
                  exit 1
                fi
                commit="${INPUT_COMMIT}"
              fi
              if existing="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
                if [[ -z "${commit}" ]]; then
                  commit="${existing}"
                elif [[ "${commit}" != "${existing}" ]]; then
                  echo "::error::tag ${tag} points at ${existing}, not ${commit}"
                  exit 1
                fi
              elif [[ -z "${commit}" ]]; then
                echo "::error::tag ${tag} does not exist; pass the commit input"
                exit 1
              fi
            fi
            git cat-file -e "${commit}^{commit}"
            if ! git merge-base --is-ancestor "${commit}" origin/main; then
              echo "::error::release commit ${commit} is not an ancestor of origin/main"
              exit 1
            fi
            version="${tag#v}"
            {
              echo "mode=release"
              echo "tag=${tag}"
              echo "version=${version}"
              echo "commit=${commit}"
              echo "image=ghcr.io/xscaler/loki"
              echo "image_tag=${version}"
              echo "environment=release"
              echo "cert_identity=${identity}"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == "push" && "${REF}" == refs/heads/ci/* ]]; then
            {
              echo "mode=rehearsal"
              echo "tag="
              echo "version=rehearsal-${SHA:0:7}"
              echo "commit=${SHA}"
              echo "image=ghcr.io/xscaler/rehearsal/loki"
              echo "image_tag=${SHA:0:7}"
              echo "environment=rehearsal"
              echo "cert_identity=${identity}"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "mode=verify"
              echo "tag="
              echo "version=verify-${SHA:0:7}"
              echo "commit=${SHA}"
              echo "image="
              echo "image_tag="
              echo "environment="
              echo "cert_identity="
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Install crane
        if: steps.meta.outputs.mode != 'verify'
        run: .github/scripts/xs-install-tool.sh crane

      - name: Log in to GHCR
        if: steps.meta.outputs.mode != 'verify'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this image is already published
        id: published
        env:
          MODE: ${{ steps.meta.outputs.mode }}
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "verify" ]]; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "digest=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          rc=0
          .github/scripts/xs-manifest-exists.sh "${IMAGE}:${IMAGE_TAG}" || rc=$?
          case "${rc}" in
            0)
              d="$(crane digest "${IMAGE}:${IMAGE_TAG}")"
              echo "${IMAGE}:${IMAGE_TAG} already exists (${d}); reusing it, no rebuild"
              echo "published=true" >> "${GITHUB_OUTPUT}"
              echo "digest=${d}" >> "${GITHUB_OUTPUT}"
              ;;
            1)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              echo "digest=" >> "${GITHUB_OUTPUT}"
              ;;
            *) exit 1 ;;
          esac

  build:
    name: build ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
      MODE: ${{ needs.prepare.outputs.mode }}
    steps:
      # The workflow's own commit supplies the scripts; the release commit is
      # checked out separately and is only the source tree that gets built.
      - name: Checkout workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: src
          persist-credentials: false

      - name: Read build parameters
        id: params
        run: |
          set -euo pipefail
          go_version="$(sed -n 's/^GO_VERSION *:= *//p' src/Makefile)"
          if [[ -z "${go_version}" ]]; then
            echo "::error::GO_VERSION not found in Makefile"
            exit 1
          fi
          {
            echo "go_version=${go_version}"
            echo "revision=$(git -C src rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src
          file: ./src/cmd/loki/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            IMAGE_TAG=${{ needs.prepare.outputs.version }}
            GO_VERSION=${{ steps.params.outputs.go_version }}
          labels: |
            org.opencontainers.image.title=loki
            org.opencontainers.image.source=https://github.com/xscaler/loki
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ steps.params.outputs.revision }}
          tags: loki:${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=docker,dest=${{ runner.temp }}/loki-${{ matrix.arch }}.tar

      - name: Load image and check the reported version
        env:
          IMAGE_TAR: ${{ runner.temp }}/loki-${{ matrix.arch }}.tar
        run: |
          set -euo pipefail
          docker load -i "${IMAGE_TAR}"
          out="$(docker run --rm "loki:${ARCH}" -version 2>&1)"
          echo "${out}"
          if ! printf '%s\n' "${out}" | head -n1 | grep -Fq "loki, version ${VERSION} "; then
            echo "::error::binary does not report version ${VERSION}"
            exit 1
          fi

      - name: Install Trivy
        run: .github/scripts/xs-install-tool.sh trivy

      - name: Trivy report (HIGH and CRITICAL)
        env:
          IMAGE_TAR: ${{ runner.temp }}/loki-${{ matrix.arch }}.tar
          SARIF: ${{ runner.temp }}/trivy-${{ matrix.arch }}.sarif
        run: |
          set -euo pipefail
          trivy image --input "${IMAGE_TAR}" --severity HIGH,CRITICAL \
            --format table --exit-code 0 --no-progress
          trivy image --input "${IMAGE_TAR}" --severity HIGH,CRITICAL \
            --format sarif --output "${SARIF}" --exit-code 0 --no-progress

      - name: Keep the SARIF report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.arch }}
          path: ${{ runner.temp }}/trivy-${{ matrix.arch }}.sarif
          retention-days: 1
          if-no-files-found: error

      - name: Trivy gate (fixable CRITICAL fails the build)
        env:
          IMAGE_TAR: ${{ runner.temp }}/loki-${{ matrix.arch }}.tar
        run: |
          trivy image --input "${IMAGE_TAR}" --severity CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress

      - name: Upload image tarball
        if: env.MODE != 'verify'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loki-${{ matrix.arch }}
          path: ${{ runner.temp }}/loki-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  # SARIF is uploaded from its own job so build jobs, which run PR code, never
  # hold security-events: write. Pull requests do not upload.
  sarif:
    name: upload Trivy SARIF
    needs: build
    if: "!cancelled() && github.event_name != 'pull_request' && needs.build.result != 'skipped'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: ${{ runner.temp }}/sarif

      - name: Upload amd64
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif/sarif-amd64/trivy-amd64.sarif
          category: trivy-loki-amd64

      - name: Upload arm64
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif/sarif-arm64/trivy-arm64.sarif
          category: trivy-loki-arm64

  publish:
    name: publish to GHCR
    needs: [prepare, build]
    if: >-
      !cancelled() && needs.prepare.outputs.mode != 'verify' &&
      (needs.build.result == 'success' || needs.prepare.outputs.published == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      ALREADY_PUBLISHED: ${{ needs.prepare.outputs.published }}
      PUBLISHED_DIGEST: ${{ needs.prepare.outputs.digest }}
    steps:
      - name: Checkout workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install crane, cosign and syft
        run: |
          set -euo pipefail
          for t in crane cosign syft; do .github/scripts/xs-install-tool.sh "${t}"; done

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image tarballs
        if: env.ALREADY_PUBLISHED != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loki-*
          path: ${{ runner.temp }}/images

      - name: Push per-arch images by digest and create the index
        id: index
        env:
          IMAGES_DIR: ${{ runner.temp }}/images
          METADATA: ${{ runner.temp }}/index-metadata.json
        run: |
          set -euo pipefail
          if [[ "${ALREADY_PUBLISHED}" == "true" ]]; then
            echo "digest=${PUBLISHED_DIGEST}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          refs=()
          for arch in amd64 arm64; do
            tar="${IMAGES_DIR}/loki-${arch}/loki-${arch}.tar"
            d="$(crane digest --tarball "${tar}")"
            crane push "${tar}" "${IMAGE}@${d}"
            echo "${arch}: ${d}"
            refs+=("${IMAGE}@${d}")
          done
          # Last check before the tag is created; a concurrent publisher must not be overwritten.
          rc=0
          .github/scripts/xs-manifest-exists.sh "${IMAGE}:${IMAGE_TAG}" || rc=$?
          if [[ "${rc}" != "1" ]]; then
            echo "::error::${IMAGE}:${IMAGE_TAG} exists or could not be checked (rc=${rc}); refusing to create it"
            exit 1
          fi
          docker buildx imagetools create --metadata-file "${METADATA}" \
            --tag "${IMAGE}:${IMAGE_TAG}" "${refs[@]}"
          d="$(jq -r '."containerimage.descriptor".digest' "${METADATA}")"
          if [[ ! "${d}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not read the index digest from the create output"
            exit 1
          fi
          echo "digest=${d}" >> "${GITHUB_OUTPUT}"
          echo "${IMAGE}:${IMAGE_TAG} -> ${d}"

      - name: Resolve per-platform digests
        id: platforms
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(crane manifest "${IMAGE}@${DIGEST}")"
          for arch in amd64 arm64; do
            d="$(jq -r --arg a "${arch}" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' <<<"${manifest}")"
            if [[ ! "${d}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no linux/${arch} manifest in ${IMAGE}@${DIGEST}"
              exit 1
            fi
            echo "${arch}=${d}" >> "${GITHUB_OUTPUT}"
          done

      - name: Attest build provenance (index)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOMs (one per platform image)
        env:
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          set -euo pipefail
          syft "${IMAGE}@${AMD64}" -o "spdx-json=${RUNNER_TEMP}/sbom-amd64.spdx.json"
          syft "${IMAGE}@${ARM64}" -o "spdx-json=${RUNNER_TEMP}/sbom-arm64.spdx.json"

      - name: Attest SBOM (linux/amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sbom-amd64.spdx.json
          push-to-registry: true

      - name: Attest SBOM (linux/arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom-arm64.spdx.json
          push-to-registry: true

      - name: Sign the index with cosign (keyless, idempotent)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          CERT_IDENTITY: ${{ needs.prepare.outputs.cert_identity }}
        run: .github/scripts/xs-ensure-signed.sh "${IMAGE}@${DIGEST}"

  verify:
    name: verify signatures and version
    needs: [prepare, publish]
    if: "!cancelled() && needs.publish.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      CERT_IDENTITY: ${{ needs.prepare.outputs.cert_identity }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install crane and cosign
        run: |
          set -euo pipefail
          for t in crane cosign; do .github/scripts/xs-install-tool.sh "${t}"; done

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the cosign signature (exact identity)
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity "${CERT_IDENTITY}" >/dev/null

      - name: Verify provenance and per-platform SBOM attestations
        run: |
          set -euo pipefail
          signer="${REPOSITORY}/.github/workflows/xs-release.yml"
          echo "== provenance on the index"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${REPOSITORY}" \
            --signer-workflow "${signer}"
          manifest="$(crane manifest "${IMAGE}@${DIGEST}")"
          for arch in amd64 arm64; do
            d="$(jq -r --arg a "${arch}" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' <<<"${manifest}")"
            echo "== SBOM for linux/${arch} (${d})"
            gh attestation verify "oci://${IMAGE}@${d}" --repo "${REPOSITORY}" \
              --signer-workflow "${signer}" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Verify the tag, platforms and the reported version
        run: |
          set -euo pipefail
          got="$(crane digest "${IMAGE}:${IMAGE_TAG}")"
          if [[ "${got}" != "${DIGEST}" ]]; then
            echo "::error::${IMAGE}:${IMAGE_TAG} resolves to ${got}, expected ${DIGEST}"
            exit 1
          fi
          platforms="$(crane manifest "${IMAGE}@${DIGEST}" | jq -r '[.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | sort | join(" ")')"
          echo "platforms: ${platforms}"
          if [[ "${platforms}" != *"linux/amd64"* || "${platforms}" != *"linux/arm64"* ]]; then
            echo "::error::missing platform in ${IMAGE}@${DIGEST}"
            exit 1
          fi
          out="$(docker run --rm "${IMAGE}@${DIGEST}" -version 2>&1)"
          echo "${out}"
          printf '%s\n' "${out}" | head -n1 | grep -Fq "loki, version ${VERSION} " || {
            echo "::error::${IMAGE} reports a different version than ${VERSION}"
            exit 1
          }

  # A dispatched release has no git tag yet. Create it only now that the image
  # is published and verified. Tags created with GITHUB_TOKEN do not start
  # another run.
  tag:
    name: create release tag
    needs: [prepare, verify]
    if: "!cancelled() && needs.verify.result == 'success' && github.event_name == 'workflow_dispatch' && needs.prepare.outputs.mode == 'release'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release tag
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Create the tag if it does not exist
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null)"; then
            echo "tag ${TAG} already exists (${existing})"
            exit 0
          fi
          gh api --method POST "repos/${REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${COMMIT}"
