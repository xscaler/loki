name: xs-setup-trivy
description: Install a pinned Trivy release and verify its checksum.
runs:
  using: composite
  steps:
    - name: Install trivy
      shell: bash
      env:
        TRIVY_VERSION: "0.76.1"
        SUM_AMD64: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        SUM_ARM64: e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) suffix=Linux-64bit; sum="${SUM_AMD64}" ;;
          aarch64) suffix=Linux-ARM64; sum="${SUM_ARM64}" ;;
          *) echo "::error::unsupported machine $(uname -m)"; exit 1 ;;
        esac
        tmp="$(mktemp -d)"
        curl -fsSL -o "${tmp}/trivy.tar.gz" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${suffix}.tar.gz"
        echo "${sum}  ${tmp}/trivy.tar.gz" | sha256sum -c -
        tar -xzf "${tmp}/trivy.tar.gz" -C "${tmp}" trivy
        sudo install -m 0755 "${tmp}/trivy" /usr/local/bin/trivy
        trivy --version
